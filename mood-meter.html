<!-- ============================================================
     FIREBASE CONFIGURATION
     ─────────────────────────────────────────────────────────────
     1. Go to https://console.firebase.google.com
     2. Create a project → Add a web app → copy the config below
     3. Build → Realtime Database → Create database → test mode
     ============================================================ -->
<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ── PASTE YOUR CONFIG HERE ───────────────────────────────── */
const firebaseConfig = {
  apiKey:            "AIzaSyBJNXiWlC4B5AkJ5p-AN7-LPaFZJ67SxP4",
  authDomain:        "mood-meter-ebb22.firebaseapp.com",
  databaseURL:       "https://mood-meter-ebb22-default-rtdb.firebaseio.com",
  projectId:         "mood-meter-ebb22",
  storageBucket:     "mood-meter-ebb22.firebasestorage.app",
  messagingSenderId: "605835927002",
  appId:             "1:605835927002:web:5bd5f8a114239ae29b34e3"
};
/* ─────────────────────────────────────────────────────────── */

/* ── ROUND LABELS (customise if needed) ──────────────────── */
const ROUND_LABELS = [
  { name: "Opening",    prompt: "How are you feeling before we start?" },
  { name: "Checkpoint", prompt: "Are you convinced so far?"             },
  { name: "Closing",    prompt: "Has your mind changed?"                },
];
/* ─────────────────────────────────────────────────────────── */

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* Firebase root ref */
const rootRef  = ref(db, "mood_meter");

/* ── Routing ── */
const isHost = new URLSearchParams(window.location.search).get("mode") === "host";

/* ── Vote score mapping ── */
const SCORES = { interested: 100, neutral: 50, bored: 0 };

/* ── Device fingerprint (one vote per round per browser) ── */
let deviceId = localStorage.getItem("mm_device_id");
if (!deviceId) {
  deviceId = Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("mm_device_id", deviceId);
}

/* ═══════════════════════════════════════════════════════════
   SHARED STATE — updated by Firebase listener
   ═══════════════════════════════════════════════════════════ */
let state = {
  currentRound : 0,   // 0-2
  roundOpen    : true, // false = voting disabled, show next-round btn
  votes        : {},   // { [deviceId]: score }
  markers      : [],   // array of avg scores locked at end of each round
};

/* Compute weighted average from votes object */
function average(votes) {
  const vals = Object.values(votes || {});
  if (!vals.length) return 50;
  return Math.round(vals.reduce((s, v) => s + v, 0) / vals.length);
}

/* ═══════════════════════════════════════════════════════════
   FIREBASE LISTENER
   ═══════════════════════════════════════════════════════════ */
onValue(rootRef, (snap) => {
  const raw = snap.val() || {};
  state.currentRound = raw.currentRound ?? 0;
  state.roundOpen    = raw.roundOpen    ?? true;
  state.votes        = raw.votes        || {};
  state.markers      = raw.markers      || [];
  render();
});

/* ═══════════════════════════════════════════════════════════
   HOST ACTIONS
   ═══════════════════════════════════════════════════════════ */
function hostCloseRound() {
  const avg     = average(state.votes);
  const markers = [...(state.markers || []), avg];
  update(rootRef, { roundOpen: false, markers });
}

function hostNextRound() {
  const next = state.currentRound + 1;
  update(rootRef, {
    currentRound : next,
    roundOpen    : true,
    votes        : {},          // clear votes for new round
  });
}

function hostReset() {
  if (!confirm("Reset everything? All rounds and votes will be cleared.")) return;
  set(rootRef, {
    currentRound : 0,
    roundOpen    : true,
    votes        : {},
    markers      : [],
  });
}

/* ═══════════════════════════════════════════════════════════
   VOTER ACTION
   ═══════════════════════════════════════════════════════════ */
function castVote(emotion) {
  if (!state.roundOpen) return;
  const votedKey = `mm_voted_r${state.currentRound}`;
  if (localStorage.getItem(votedKey)) return; // already voted
  update(ref(db, `mood_meter/votes`), { [deviceId]: SCORES[emotion] });
  localStorage.setItem(votedKey, "1");
  render(); // instant local feedback
}

/* ═══════════════════════════════════════════════════════════
   RENDER  (called on every Firebase update)
   ═══════════════════════════════════════════════════════════ */
function render() {
  isHost ? renderHost() : renderVoter();
}

/* ── Shared bar position calc ── */
function barState() {
  const avg     = average(state.votes);
  const markers = state.markers || [];
  const total   = Object.keys(state.votes).length;
  return { avg, markers, total };
}

/* ══════════════════════════════════════════
   HOST VIEW
   ══════════════════════════════════════════ */
function renderHost() {
  document.getElementById("host-view").style.display  = "flex";
  document.getElementById("voter-view").style.display = "none";

  const { avg, markers, total } = barState();
  const round = state.currentRound;
  const open  = state.roundOpen;
  const label = ROUND_LABELS[round] || ROUND_LABELS[2];

  /* round pill */
  document.getElementById("h-round-pill").textContent =
    `Round ${round + 1} / ${ROUND_LABELS.length} — ${label.name}`;
  document.getElementById("h-prompt").textContent = label.prompt;
  document.getElementById("h-vote-count").textContent =
    `${total} vote${total !== 1 ? "s" : ""} received`;

  /* bar */
  renderBar("h-bar-wrap", avg, markers);

  /* status + buttons */
  const btnClose = document.getElementById("h-btn-close");
  const btnNext  = document.getElementById("h-btn-next");
  const btnReset = document.getElementById("h-btn-reset");
  const status   = document.getElementById("h-status");

  if (open) {
    btnClose.style.display = "inline-flex";
    btnNext.style.display  = "none";
    status.textContent     = "Voting open";
    status.className       = "status-badge open";
  } else {
    btnClose.style.display = "none";
    const hasNext = round < ROUND_LABELS.length - 1;
    btnNext.style.display  = hasNext ? "inline-flex" : "none";
    btnNext.textContent    = `Open round ${round + 2}: ${ROUND_LABELS[round + 1]?.name ?? ""}`;
    status.textContent     = "Round closed";
    status.className       = "status-badge closed";
  }

  /* show comparison legend if we have markers */
  renderMarkerLegend(markers);

  /* wire host buttons (idempotent via onclick) */
  btnClose.onclick = hostCloseRound;
  btnNext.onclick  = hostNextRound;
  btnReset.onclick = hostReset;
}

/* ══════════════════════════════════════════
   VOTER VIEW
   ══════════════════════════════════════════ */
function renderVoter() {
  document.getElementById("voter-view").style.display = "flex";
  document.getElementById("host-view").style.display  = "none";

  const { avg, markers, total } = barState();
  const round     = state.currentRound;
  const open      = state.roundOpen;
  const label     = ROUND_LABELS[round] || ROUND_LABELS[2];
  const votedKey  = `mm_voted_r${round}`;
  const hasVoted  = !!localStorage.getItem(votedKey);

  document.getElementById("v-prompt").textContent =
    open ? label.prompt : "Round closed — watch the screen!";

  /* bar (always visible on phones) */
  renderBar("v-bar-wrap", avg, markers);

  document.getElementById("v-vote-count").textContent =
    `${total} vote${total !== 1 ? "s" : ""}`;

  /* buttons area */
  const btnsEl    = document.getElementById("v-buttons");
  const waitEl    = document.getElementById("v-wait");
  const closedEl  = document.getElementById("v-closed");

  if (!open) {
    btnsEl.style.display   = "none";
    waitEl.style.display   = "none";
    closedEl.style.display = "flex";
    return;
  }

  if (hasVoted) {
    btnsEl.style.display   = "none";
    waitEl.style.display   = "flex";
    closedEl.style.display = "none";
  } else {
    btnsEl.style.display   = "flex";
    waitEl.style.display   = "none";
    closedEl.style.display = "none";
  }
}

/* ══════════════════════════════════════════
   RENDER THE GRADIENT BAR + CURSOR
   ══════════════════════════════════════════ */
function renderBar(containerId, avg, markers) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;

  /* Build marker pins HTML */
  const pinHTML = (markers || []).map((m, i) => `
    <div class="marker-pin" style="left:${m}%" title="Round ${i+1}: ${m}%">
      <div class="marker-line"></div>
      <div class="marker-dot"></div>
      <div class="marker-label">R${i+1}</div>
    </div>
  `).join("");

  wrap.innerHTML = `
    <div class="bar-outer">
      <div class="bar-gradient"></div>
      ${pinHTML}
      <div class="bar-cursor" id="${containerId}-cursor" style="left:${avg}%">
        <div class="cursor-needle"></div>
        <div class="cursor-bubble">${avg}%</div>
      </div>
    </div>
    <div class="bar-labels-row">
      <span class="bar-label-left">😴 Bored</span>
      <span class="bar-label-right">😄 Interested</span>
    </div>
  `;
}

/* ══════════════════════════════════════════
   MARKER LEGEND (host only)
   ══════════════════════════════════════════ */
function renderMarkerLegend(markers) {
  const el = document.getElementById("h-legend");
  if (!el) return;
  if (!markers || markers.length === 0) { el.innerHTML = ""; return; }

  const items = markers.map((m, i) => {
    const color = scoreToColor(m);
    return `<div class="legend-item">
      <span class="legend-dot" style="background:${color}"></span>
      <span>${ROUND_LABELS[i]?.name ?? `R${i+1}`}: <strong>${m}%</strong></span>
    </div>`;
  }).join("");

  const last = markers[markers.length - 1];
  const cur  = average(state.votes);
  const diff = cur - last;
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "—";
  const diffColor = diff > 0 ? "#22c55e" : diff < 0 ? "#ef4444" : "#888";

  el.innerHTML = `
    <div class="legend-wrap">
      ${items}
      ${markers.length > 0 && state.roundOpen ? `
        <div class="legend-item">
          <span style="color:${diffColor};font-weight:700">${arrow} ${Math.abs(diff)}pts</span>
          <span style="color:#888">vs last round</span>
        </div>` : ""}
    </div>
  `;
}

/* Convert 0-100 score to a CSS color (red→yellow→green) */
function scoreToColor(score) {
  const r = score < 50 ? 239 : Math.round(239 - (score - 50) * 3.9);
  const g = score > 50 ? 34  : Math.round((score / 50) * 180);
  return `rgb(${r},${g},60)`;
}

/* ══════════════════════════════════════════
   QR CODE
   ══════════════════════════════════════════ */
function buildQR() {
  const voterURL = window.location.origin + window.location.pathname;
  const canvas   = document.getElementById("qr-canvas");
  if (!canvas) return;
  try {
    QRCode.draw(voterURL, null, canvas, 96);
    document.getElementById("qr-url").textContent = voterURL;
  } catch(e) {
    document.getElementById("qr-panel").style.display = "none";
  }
}

/* ══════════════════════════════════════════
   INIT
   ══════════════════════════════════════════ */
document.addEventListener("DOMContentLoaded", () => {
  /* Show correct shell */
  if (isHost) {
    document.getElementById("host-view").style.display  = "flex";
    document.getElementById("voter-view").style.display = "none";
    buildQR();
  } else {
    document.getElementById("voter-view").style.display = "flex";
    document.getElementById("host-view").style.display  = "none";
    /* Wire vote buttons */
    ["interested","neutral","bored"].forEach(e => {
      document.getElementById(`vote-${e}`)?.addEventListener("click", () => castVote(e));
    });
  }
});
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #f0f2f5;
  --surface: #ffffff;
  --border:  #e2e8f0;
  --text:    #1a202c;
  --muted:   #718096;
  --radius:  16px;
  --ease:    cubic-bezier(.4,0,.2,1);
}

html, body { height: 100%; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

/* ════════════════════════════════════════
   HOST VIEW
   ════════════════════════════════════════ */
#host-view {
  display: none;
  flex-direction: column;
  min-height: 100vh;
  padding: 32px 28px 28px;
  max-width: 900px;
  margin: 0 auto;
  gap: 24px;
}

.host-topbar {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.round-pill {
  font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  background: #1a202c; color: #fff; padding: 6px 16px; border-radius: 99px;
}
.status-badge {
  font-size: .82rem; font-weight: 600; padding: 5px 14px; border-radius: 99px;
}
.status-badge.open   { background: #dcfce7; color: #166534; }
.status-badge.closed { background: #fee2e2; color: #991b1b; }

.host-prompt {
  font-size: clamp(1.2rem, 2.8vw, 1.7rem);
  font-weight: 700; text-align: center; color: var(--text);
  padding: 0 8px;
}

.vote-count {
  text-align: center; font-size: .9rem; color: var(--muted); margin-top: -10px;
}

/* ── Gradient bar ── */
.bar-outer {
  position: relative;
  width: 100%; height: 56px;
  border-radius: 99px; overflow: visible;
  margin: 12px 0 8px;
}
.bar-gradient {
  position: absolute; inset: 0;
  border-radius: 99px;
  background: linear-gradient(to right,
    #ef4444 0%,
    #f97316 25%,
    #facc15 50%,
    #84cc16 75%,
    #22c55e 100%
  );
  box-shadow: 0 2px 16px rgba(0,0,0,.12);
}

/* Cursor (live position) */
.bar-cursor {
  position: absolute; top: 50%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center;
  transition: left .6s var(--ease);
  z-index: 10;
  pointer-events: none;
}
.cursor-needle {
  width: 4px; height: 72px;
  background: #1a202c;
  border-radius: 2px;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.cursor-bubble {
  position: absolute; top: -30px;
  background: #1a202c; color: #fff;
  font-size: .85rem; font-weight: 800;
  padding: 4px 10px; border-radius: 8px;
  white-space: nowrap;
}
.cursor-bubble::after {
  content: '';
  position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: #1a202c;
}

/* Round marker pins */
.marker-pin {
  position: absolute; top: 50%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center;
  z-index: 5;
  pointer-events: none;
}
.marker-line {
  width: 2px; height: 64px;
  background: rgba(255,255,255,.85);
  border-radius: 1px;
}
.marker-dot {
  width: 10px; height: 10px;
  background: #fff; border: 2px solid #1a202c;
  border-radius: 50%; margin-top: -2px;
}
.marker-label {
  margin-top: 4px;
  font-size: .7rem; font-weight: 700;
  color: #1a202c;
  background: rgba(255,255,255,.9);
  padding: 1px 5px; border-radius: 4px;
}

/* End labels */
.bar-labels-row {
  display: flex; justify-content: space-between;
  font-size: .82rem; color: var(--muted); font-weight: 500;
  padding: 0 4px; margin-top: 44px;
}

/* Legend */
.legend-wrap {
  display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  padding: 14px 20px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.legend-item { display: flex; align-items: center; gap: 8px; font-size: .88rem; }
.legend-dot  { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

/* Controls */
.host-controls {
  display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 22px; border-radius: 10px;
  font-size: .93rem; font-weight: 600; cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text);
  transition: background .15s;
}
.btn:hover { background: var(--border); }
.btn-primary { background: #1a202c; color: #fff; border-color: #1a202c; }
.btn-primary:hover { background: #2d3748; }
.btn-danger  { color: #dc2626; border-color: #fca5a5; }
.btn-danger:hover { background: #fef2f2; }

/* QR panel */
#qr-panel {
  display: flex; align-items: center; gap: 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px;
  margin-top: auto;
}
.qr-info strong { display: block; font-size: .95rem; margin-bottom: 3px; }
.qr-info small  { color: var(--muted); font-size: .78rem; word-break: break-all; }
#qr-canvas { border-radius: 6px; flex-shrink: 0; }

/* ════════════════════════════════════════
   VOTER VIEW
   ════════════════════════════════════════ */
#voter-view {
  display: none;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 36px 20px 32px;
  gap: 20px;
  max-width: 480px;
  margin: 0 auto;
}

#v-prompt {
  font-size: clamp(1.1rem, 4vw, 1.4rem);
  font-weight: 700; text-align: center;
}

.v-bar-section { width: 100%; padding: 8px 0 0; }

#v-vote-count {
  font-size: .82rem; color: var(--muted); text-align: center; margin-top: 42px;
}

/* Voter vote buttons */
#v-buttons {
  display: flex; flex-direction: column; gap: 14px;
  width: 100%; max-width: 340px;
}
.vote-btn {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 20px 24px; border-radius: 14px; border: none;
  font-size: 1.15rem; font-weight: 700; color: #fff; cursor: pointer;
  transition: transform .1s, opacity .15s;
  -webkit-tap-highlight-color: transparent;
}
.vote-btn:active { transform: scale(.96); }
.vote-btn .v-emoji { font-size: 1.8rem; }
#vote-interested { background: #22c55e; }
#vote-neutral    { background: #facc15; color: #713f12; }
#vote-bored      { background: #ef4444; }

/* After-vote screens */
#v-wait, #v-closed {
  display: none;
  flex-direction: column; align-items: center; gap: 10px;
  text-align: center;
}
.state-icon  { font-size: 3rem; }
.state-title { font-size: 1.2rem; font-weight: 700; }
.state-sub   { color: var(--muted); font-size: .9rem; }
</style>
